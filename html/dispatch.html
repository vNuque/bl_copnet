<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: rgba(28, 30, 36, 0.94);
      --bg-focus: rgba(36, 40, 50, 0.96);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --chip: #3a3f4b;
      --accent: #60a5fa;
      --ok: #34d399;

      /* Tablet-Gehaeuse: gleiche Graphit-Palette wie CopNet, damit
         Bildschirm und Rahmen nicht aus zwei Welten stammen. */
      --shell: #15181d;
      --shell-edge: #0a0c0f;
      --screen: #0e1013;
      --screen-bar: #14171c;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.13);
      --ink: #e6e8ec;
      --ink-2: #a8aeb8;
      --ink-3: #7d848f;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: transparent;
      overflow: hidden;
      color: var(--text);
    }
    #stack {
      position: absolute;
      top: 12vh;
      left: 2.2vw;
      width: min(360px, 28vw);
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }
    .card {
      background: var(--bg);
      border-radius: 12px;
      padding: 14px 16px 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.04);
      opacity: .92;
      transform: translateX(0);
      transition: border-color .15s ease, opacity .15s ease;
    }
    .card.focused {
      background: var(--bg-focus);
      border-color: rgba(96,165,250,.55);
      opacity: 1;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chip {
      background: var(--chip);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .title {
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
    }
    .badge {
      width: 22px;
      height: 22px;
      opacity: .85;
      flex: 0 0 auto;
    }
    .rows { display: flex; flex-direction: column; gap: 6px; }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .row svg { width: 14px; height: 14px; flex: 0 0 auto; opacity: .8; }
    .row strong { color: var(--text); font-weight: 600; }
    .foot {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .hint { color: var(--accent); font-weight: 600; }
    .ago { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .keys {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .keychip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.2;
    }
    .keychip kbd {
      display: inline-block;
      min-width: 1.35em;
      text-align: center;
      background: rgba(96,165,250,.18);
      border: 1px solid rgba(96,165,250,.35);
      color: #dbeafe;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-weight: 700;
      font-size: 11px;
    }
    .card.focused .keychip {
      background: rgba(96,165,250,.10);
    }

    #tablet {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(4, 5, 7, 0.72);
      align-items: center;
      justify-content: center;
      padding: 2vh 2vw;
    }
    #tablet.open { display: flex; }

    /* Feste Geraeteproportion: das Tablet soll wie ein Gegenstand in der
       Hand wirken und nicht wie ein Vollbildfenster mit Rand. */
    .tablet-device {
      position: relative;
      width: min(96vw, calc(94vh * 16 / 10));
      aspect-ratio: 16 / 10;
      padding: 18px 18px 26px;
      border-radius: 26px;
      background: var(--shell);
      box-shadow:
        inset 0 1px 0 0 rgba(255,255,255,.06),
        inset 0 0 0 1px rgba(0,0,0,.5),
        0 0 0 1px var(--shell-edge),
        0 30px 70px rgba(0,0,0,.65);
    }
    /* Frontkamera im oberen Gehaeusesteg. */
    .tablet-camera {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #05070a;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    }
    /* Seitentasten, damit die Silhouette nicht nur ein Rechteck ist. */
    .tablet-key {
      position: absolute;
      right: -3px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: #22262d;
    }
    .tablet-key-power { top: 14%; height: 44px; }
    .tablet-key-volume { top: calc(14% + 60px); height: 76px; }
    .tablet-brand {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .3em;
      color: rgba(255,255,255,.15);
    }

    .tablet-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 7px;
      overflow: hidden;
      background: var(--screen);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.85);
    }
    .tablet-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: var(--screen-bar);
      border-bottom: 1px solid var(--line);
    }
    .tablet-bar strong {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;
      color: var(--ink-2);
    }
    .tablet-bar .spacer { flex: 1; }
    .tablet-bar button {
      background: transparent;
      color: var(--ink-2);
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      padding: 3px 9px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
      cursor: pointer;
    }
    .tablet-bar button:hover { background: rgba(255,255,255,.06); color: var(--ink); }
    .tablet-status {
      color: var(--ink-3);
      font-size: 11px;
    }
    .tablet-clock {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    #tablet-frame {
      flex: 1;
      display: block;
      width: 100%;
      border: 0;
      background: var(--screen);
    }
    /* CEF zeichnet um das fokussierte iframe sonst einen blauen Ring. */
    #tablet-frame:focus,
    #tablet-frame:focus-visible { outline: 0; }
  </style>
</head>
<body>
  <div id="stack"></div>

  <div id="tablet" aria-hidden="true">
    <div class="tablet-device">
      <span class="tablet-camera" aria-hidden="true"></span>
      <span class="tablet-key tablet-key-power" aria-hidden="true"></span>
      <span class="tablet-key tablet-key-volume" aria-hidden="true"></span>
      <div class="tablet-screen">
        <div class="tablet-bar">
          <strong>BLACKLEAF COPNET</strong>
          <span class="tablet-status" id="tablet-status">Laden…</span>
          <span class="spacer"></span>
          <span class="tablet-clock" id="tablet-clock"></span>
          <button type="button" id="tablet-close">Schliessen &middot; ESC</button>
        </div>
        <iframe id="tablet-frame" title="CopNet" allow="clipboard-read; clipboard-write"></iframe>
      </div>
      <span class="tablet-brand" aria-hidden="true">BLACKLEAF</span>
    </div>
  </div>

  <script>
    const stack = document.getElementById('stack');
    const tablet = document.getElementById('tablet');
    const tabletFrame = document.getElementById('tablet-frame');
    const tabletStatus = document.getElementById('tablet-status');
    const tabletClock = document.getElementById('tablet-clock');
    let tabletClockTimer = null;

    let keyHints = { accept: 'G', cycle: 'H', dismiss: 'J' };

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function icon(name) {
      const paths = {
        pin: '<path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/>',
        road: '<path d="M11 2 4 22h3l1.3-4h7.4L17 22h3L13 2h-2zm-.2 12L12 6.5 13.2 14h-2.4z"/>',
        user: '<path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-8 2-8 4v2h16v-2c0-2-4-4-8-4z"/>',
        car: '<path d="M5 11 6.5 6.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h1a1 1 0 0 1 1 1v5h-2v2h-2v-2H7v2H5v-2H3v-5a1 1 0 0 1 1-1h1zm2.5 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm9 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>',
        plate: '<path d="M3 7h18v10H3V7zm2 2v6h14V9H5z"/>',
        color: '<path d="M12 3a9 9 0 0 0 0 18c.8 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.2-.3-.3-.6-.3-1a1.5 1.5 0 0 1 1.5-1.5H16a5 5 0 0 0 0-10H12zm-5 7.5A1.5 1.5 0 1 1 8.5 9 1.5 1.5 0 0 1 7 10.5zm3-4A1.5 1.5 0 1 1 11.5 5 1.5 1.5 0 0 1 10 6.5zm4 0A1.5 1.5 0 1 1 15.5 5 1.5 1.5 0 0 1 14 6.5zm3 4A1.5 1.5 0 1 1 18.5 9 1.5 1.5 0 0 1 17 10.5z"/>',
        clock: '<path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 11H7v-2h4V6h2z"/>',
        badge: '<path d="M12 2 8 4v4c0 4 2.5 7.5 4 9 1.5-1.5 4-5 4-9V4l-4-2zm0 5a2 2 0 1 1-2 2 2 2 0 0 1 2-2z"/>',
      };
      return `<svg viewBox="0 0 24 24" fill="currentColor">${paths[name] || ''}</svg>`;
    }

    function timeAgo(iso) {
      if (!iso) return '';
      const t = Date.parse(iso);
      if (!Number.isFinite(t)) return '';
      const sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
      if (sec < 5) return 'Gerade eben';
      if (sec < 60) return sec + ' Sek. zuvor';
      const min = Math.floor(sec / 60);
      if (min < 60) return min + ' Min. zuvor';
      return Math.floor(min / 60) + ' Std. zuvor';
    }

    function row(ico, text) {
      if (!text) return '';
      return `<div class="row">${icon(ico)}<span>${esc(text)}</span></div>`;
    }

    function keyRow(focused, claimable) {
      const acceptLabel = claimable ? 'Annehmen + zuteilen' : 'Annehmen';
      const chips = [
        `<span class="keychip"><kbd>${esc(keyHints.accept)}</kbd>${esc(acceptLabel)}</span>`,
        `<span class="keychip"><kbd>${esc(keyHints.cycle)}</kbd>Nächster</span>`,
        `<span class="keychip"><kbd>${esc(keyHints.dismiss)}</kbd>Ausblenden</span>`,
      ];
      return `<div class="keys">${chips.join('')}</div>`;
    }

    function render(calls) {
      if (!Array.isArray(calls) || !calls.length) {
        stack.innerHTML = '';
        return;
      }
      stack.innerHTML = calls.map((c, idx) => {
        const d = c.details || {};
        const loc = c.locationText || [d.postal && ('PLZ ' + d.postal), d.street, d.district].filter(Boolean).join(', ');
        const dist = Number.isFinite(c.distance) ? (c.distance + ' Meter') : null;
        const lines = [
          row('pin', loc),
          row('road', dist),
          row('user', d.gender || null),
          row('user', d.personName || null),
          row('car', d.vehicle || null),
          row('plate', d.plate || null),
          row('color', d.color || null),
        ].join('');
        return `
          <article class="card ${c.focused ? 'focused' : ''}">
            <div class="head">
              <span class="chip">#${esc(c.seq || (idx + 1))}</span>
              ${c.code ? `<span class="chip">${esc(c.code)}</span>` : ''}
              <div class="title">${esc(c.title || 'Einsatz')}</div>
              <div class="badge">${icon('badge')}</div>
            </div>
            <div class="rows">${lines}</div>
            ${c.focused ? keyRow(true, c.claimable) : ''}
            <div class="foot">
              <span class="hint">${c.focused ? 'Ausgewählt' : (`${esc(keyHints.cycle)} = wählen`)}</span>
              <span class="ago">${icon('clock')}${esc(timeAgo(c.createdAt))}</span>
            </div>
          </article>`;
      }).join('');
    }

    function tickClock() {
      tabletClock.textContent = new Date().toLocaleTimeString('de-DE', {
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function closeTablet() {
      tablet.classList.remove('open');
      tablet.setAttribute('aria-hidden', 'true');
      tabletFrame.removeAttribute('src');
      tabletStatus.textContent = '';
      clearInterval(tabletClockTimer);
      tabletClockTimer = null;
      fetch(`https://${GetParentResourceName()}/tabletClose`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      }).catch(() => {});
    }

    function openTablet(url, label) {
      tabletStatus.textContent = label || 'CopNet';
      tabletFrame.src = url || 'about:blank';
      tablet.classList.add('open');
      tablet.setAttribute('aria-hidden', 'false');
      tickClock();
      clearInterval(tabletClockTimer);
      tabletClockTimer = setInterval(tickClock, 15000);
    }

    document.getElementById('tablet-close').addEventListener('click', closeTablet);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && tablet.classList.contains('open')) {
        e.preventDefault();
        closeTablet();
      }
    });

    window.addEventListener('message', (e) => {
      const data = e.data || {};
      if (data.action === 'setCalls') {
        if (data.keys && typeof data.keys === 'object') {
          keyHints = {
            accept: String(data.keys.accept || keyHints.accept || 'G'),
            cycle: String(data.keys.cycle || keyHints.cycle || 'H'),
            dismiss: String(data.keys.dismiss || keyHints.dismiss || 'J'),
          };
        }
        render(data.calls || []);
      }
      if (data.action === 'openTablet') openTablet(data.url, data.label);
      if (data.action === 'closeTablet') closeTablet();
    });
  </script>
</body>
</html>
